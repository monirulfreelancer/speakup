# Local development database. Mirrors what Coolify runs in production
# (self-hosted Postgres), so local and prod behave the same.
#
# Host port 5434 — 5432 and 5433 are taken by other projects on this machine.
services:
  db:
    image: postgres:17-alpine
    container_name: speakup-db
    environment:
      POSTGRES_USER: speakup
      POSTGRES_PASSWORD: speakup
      POSTGRES_DB: speakup
    ports:
      - "5434:5432"
    volumes:
      - speakup-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakup -d speakup"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  speakup-pgdata:
